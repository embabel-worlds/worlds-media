# Puts one released cut on YouTube again, by hand (Actions, "YouTube upload", Run workflow, with its id): for when the
# release workflow's YouTube step failed, or ran before the YouTube secrets were set. Shipping a cut does this itself
# (.github/workflows/release.yml).
#
# A cut not yet on YouTube is uploaded and its id recorded in videos.json; a new cut of a video already there replaces
# its captions (scripts/youtube-upload.mjs). Until the three YOUTUBE_ secrets are set (scripts/youtube-auth.mjs sets
# them), the job says so and stops. Until Google has audited the API project, YouTube keeps every upload private, so
# upload public cuts by hand until then (see the README).
name: YouTube upload

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The cut's id, as the catalog lists it
        required: true

concurrency:
  group: youtube-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      # main, not the release's tag: videos.json is committed back to main, which may have moved on since the tag.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Check for the YouTube secrets
        id: creds
        env:
          REFRESH: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -z "$REFRESH" ]; then
            echo "::notice::No YouTube secrets yet, so nothing is uploaded: run scripts/youtube-auth.mjs (see the README)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the cut
        if: steps.creds.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        # bash with pipefail, so a failed upload fails the job rather than passing through tee.
        shell: bash
        run: node scripts/youtube-upload.mjs "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      # Even when a later step of the upload failed: once the video is on YouTube its id is in videos.json here, and is
      # recorded on main, so a rerun doesn't upload it again.
      - name: Record the video's id
        if: ${{ !cancelled() && steps.creds.outputs.configured == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          youtube=$(jq -r --arg id "$TAG" '.videos[] | select(.id == $id) | .youtube // empty' videos.json)
          [ -n "$youtube" ] || exit 0
          scripts/on-main.sh "$TAG is on YouTube" "videos.json README.md" \
            bash -c 'node scripts/release.mjs "$TAG" --youtube "$0" && node scripts/catalog.mjs' "$youtube"
